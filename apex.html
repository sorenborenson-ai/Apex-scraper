<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"></script>

    <style>
        
        .apex-logo {
            width: 100;
            height: 100;
            flex-direction: column;
            align-items: center;

        }



        .result {
            color: white;
        }

        .analyzing {
            background: linear-gradient(
                110deg,
                #aab7c4 0%,
                #aab7c4 40%,
                #ffffff 50%,
                #aab7c4 60%,
                #aab7c4 100%
            );
            background-size: 250% 100%;
            background-position: 150% center;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 150% center; }
            20%  { background-position: -50% center; }
            100% { background-position: -50% center; }
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex</title>
</head>
    <body style ="background-color: black;">

        <div><img class="apex-logo" src="apex-logo.png" alt="Apex logo"></div>

        <div>
            <input id = "input" class = "input" placeholder= "what to scrape" type="text">
            <button onclick = "sendURL()">upload</button>
        </div>

        <pre id = "result" class = "result"></pre>

    <script>
        function sendURL() {



            // Validate
            let parsed;

            try {
                parsed = new URL(input.value);
            } catch {
                document.getElementById("result").textContent = "Not valid URL";
                return
            }

            if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
            document.getElementById("result").textContent = "URL must start with 'http' or 'https'";
                return
            }

            const resultEl = document.getElementById("result");
            resultEl.classList.add("analyzing");
            resultEl.textContent = "Analyzing";

            fetch(`https://apex-scraper.onrender.com/scrape?url=${encodeURIComponent(parsed)}`)
            .then(response => response.text())
            .then(html => {
               const pretty = html_beautify(html, { indent_size: 2, wrap_line_length: 120 });
               resultEl.classList.remove("analyzing");
               resultEl.textContent = pretty;
            });
            

        }

    </script>
</body>
